services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vinyl
      POSTGRES_USER: vinyl
      POSTGRES_PASSWORD: vinyl123
    ports:
      - "5434:5432"
    volumes:
      - ./sql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinyl -d vinyl"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/vinyl
      DB_USERNAME: vinyl
      DB_PASSWORD: vinyl123
      APP_CORS_ALLOWED_ORIGINS: "*"
      JWT_SECRET: "dev-local-secret-nao-usar-em-producao-32bytes-minimo"
      JWT_EXPIRATION_MINUTES: 60
      PEPPER: "dev-pepper-local"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
