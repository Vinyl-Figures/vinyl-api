spring.application.name=VinylPgApi

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

spring.sql.init.mode=never

spring.main.lazy-initialization=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.shipping.origin-zip-code=${SHIPPING_ORIGIN_ZIP:04285000}
app.shipping.base-price=${SHIPPING_BASE_PRICE:10.00}
app.shipping.price-per-km=${SHIPPING_PRICE_PER_KM:2.50}
